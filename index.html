<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trip Album Builder</title>
<link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">📷 Trip Album Builder</div>
    <nav class="tabs size-tabs">
      <button class="tab-btn active" data-size="30">30×30 cm</button>
      <button class="tab-btn" data-size="20">20×20 cm</button>
    </nav>
  </header>

  <main id="sizePanels">
    <!-- Repeated once per album size (see js/app.js ALBUM_SIZES) -->
    <template id="sizePanelTemplate">
      <div class="size-panel">
        <nav class="tabs subtabs">
          <button class="tab-btn active" data-subtab="new">New Album</button>
          <button class="tab-btn" data-subtab="draft">Draft</button>
          <button class="tab-btn" data-subtab="history">History</button>
        </nav>

        <!-- NEW ALBUM -->
        <section data-subpanel="new" class="tab-panel active">
          <div class="panel-inner">
            <div class="dropzone" data-el="dropzone">
              <input type="file" accept=".zip" hidden data-el="fileInput" />
              <div class="dz-icon">⬆️</div>
              <div class="dz-text">Drop a ZIP of your trip photos here</div>
              <div class="dz-sub">or click to browse &middot; folders inside the zip = days</div>
            </div>

            <div class="status-line" hidden data-el="loadStatus"></div>

            <div class="project-setup" hidden data-el="projectSetup">
              <label class="field">
                <span>Album title</span>
                <input type="text" placeholder="e.g. Vietnam 2026" data-el="albumTitle" />
              </label>

              <h3>Days found</h3>
              <ul class="day-list" data-el="dayList"></ul>

              <button class="primary-btn" data-el="buildDraftBtn">Generate Draft →</button>
            </div>
          </div>
        </section>

        <!-- DRAFT -->
        <section data-subpanel="draft" class="tab-panel">
          <div class="panel-inner">
            <div class="empty-hint" data-el="draftEmpty">
              No draft yet. Go to <b>New Album</b> and drop a zip to generate one.
            </div>
            <div class="draft-toolbar" hidden data-el="draftToolbar">
              <div class="draft-title" data-el="draftTitle"></div>
              <div class="draft-hint">Drag a photo onto another to swap places, or tap 🔍 to zoom/reposition it within its frame. Click the shaded cell on a day's first page to edit its caption, tap "Aa" on any photo to move the text frame there, or ✕ to remove a photo from the album.</div>
              <div class="draft-actions">
                <button class="ghost-btn" data-el="spreadViewBtn">Spread view</button>
                <button class="ghost-btn" data-el="rebuildBtn">Reshuffle layouts</button>
                <button class="primary-btn" data-el="approveBtn">Approve &amp; Export PDF (200 DPI)</button>
              </div>
            </div>
            <div class="pages" data-el="pages"></div>
          </div>
        </section>

        <!-- HISTORY -->
        <section data-subpanel="history" class="tab-panel">
          <div class="panel-inner">
            <div class="empty-hint" data-el="historyEmpty">No albums generated yet.</div>
            <ul class="history-list" data-el="historyList"></ul>
          </div>
        </section>
      </div>
    </template>
  </main>

  <div id="exportOverlay" class="overlay" hidden>
    <div class="overlay-box">
      <div class="spinner"></div>
      <div id="exportMsg">Rendering pages…</div>
    </div>
  </div>
</div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/heic2any.min.js"></script>
<script src="js/grids.js"></script>
<script src="js/db.js"></script>
<script src="js/layout-engine.js"></script>
<script src="js/draft-view.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
